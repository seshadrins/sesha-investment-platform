name: personal-ai-portfolio

services:
  db:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - portfolio_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      MAX_POSITION_WEIGHT: ${MAX_POSITION_WEIGHT:-0.15}
      TRIM_POSITION_WEIGHT: ${TRIM_POSITION_WEIGHT:-0.20}
      PREFERRED_HOLD_DAYS: ${PREFERRED_HOLD_DAYS:-365}
      LOSS_REVIEW_THRESHOLD: ${LOSS_REVIEW_THRESHOLD:--0.15}
      PROFIT_REVIEW_THRESHOLD: ${PROFIT_REVIEW_THRESHOLD:-0.30}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-}
      UPSTOX_API_KEY: ${UPSTOX_API_KEY:-}
      ANALYSIS_SCHEDULE_HOUR: ${ANALYSIS_SCHEDULE_HOUR:-6}
      ANALYSIS_SCHEDULE_MINUTE: ${ANALYSIS_SCHEDULE_MINUTE:-0}
      ANALYSIS_SCHEDULE_DAYS: ${ANALYSIS_SCHEDULE_DAYS:-tue-sat}
      ANALYSIS_SCHEDULE_TIMEZONE: ${ANALYSIS_SCHEDULE_TIMEZONE:-Asia/Kolkata}
      ANALYSIS_RUN_ON_STARTUP: ${ANALYSIS_RUN_ON_STARTUP:-true}
      FUNDAMENTALS_BATCH_SIZE: ${FUNDAMENTALS_BATCH_SIZE:-10}
      SCREENING_BATCH_SIZE: ${SCREENING_BATCH_SIZE:-10}
      UNIVERSE_SCHEDULE_MONTHS: ${UNIVERSE_SCHEDULE_MONTHS:-4,10}
      INVESTOR_DISCLOSURE_LAG_DAYS: ${INVESTOR_DISCLOSURE_LAG_DAYS:-21}
      DISCLOSURE_AUTO_INGEST_ENABLED: ${DISCLOSURE_AUTO_INGEST_ENABLED:-true}
      DISCLOSURE_BATCH_SIZE: ${DISCLOSURE_BATCH_SIZE:-10}
      DISCLOSURE_REQUEST_INTERVAL_SECONDS: ${DISCLOSURE_REQUEST_INTERVAL_SECONDS:-1.0}
      DISCLOSURE_CACHE_HOURS: ${DISCLOSURE_CACHE_HOURS:-24}
      DISCLOSURE_FUZZY_MATCH_THRESHOLD: ${DISCLOSURE_FUZZY_MATCH_THRESHOLD:-0.84}
      DISCLOSURE_LLM_PROVIDER: ${DISCLOSURE_LLM_PROVIDER:-auto}
      DISCLOSURE_LLM_MAX_CHARS: ${DISCLOSURE_LLM_MAX_CHARS:-120000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it:free}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-25000000}
      DOCUMENT_LLM_MAX_CHARS: ${DOCUMENT_LLM_MAX_CHARS:-90000}
      DOCUMENT_PROMPT_VERSION: ${DOCUMENT_PROMPT_VERSION:-grounded-analysis-v1}
      IPO_DISCOVERY_ENABLED: ${IPO_DISCOVERY_ENABLED:-true}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      AUTOMATION_ALERTS_ENABLED: ${AUTOMATION_ALERTS_ENABLED:-true}
      ANALYSIS_START_GRACE_MINUTES: ${ANALYSIS_START_GRACE_MINUTES:-15}
      ANALYSIS_STALL_MINUTES: ${ANALYSIS_STALL_MINUTES:-90}
      ANALYSIS_CATCHUP_MAX_HOURS: ${ANALYSIS_CATCHUP_MAX_HOURS:-48}
      ANALYSIS_RETRY_DELAYS_MINUTES: ${ANALYSIS_RETRY_DELAYS_MINUTES:-30,60}
      SCHEDULER_HEARTBEAT_SECONDS: ${SCHEDULER_HEARTBEAT_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  analysis-scheduler:
    build:
      context: ./services/api
    command: ["python", "-m", "app.scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-}
      UPSTOX_API_KEY: ${UPSTOX_API_KEY:-}
      UPSTOX_API_BASE_URL: ${UPSTOX_API_BASE_URL:-https://api.upstox.com}
      ANALYSIS_SCHEDULE_HOUR: ${ANALYSIS_SCHEDULE_HOUR:-6}
      ANALYSIS_SCHEDULE_MINUTE: ${ANALYSIS_SCHEDULE_MINUTE:-0}
      ANALYSIS_SCHEDULE_DAYS: ${ANALYSIS_SCHEDULE_DAYS:-tue-sat}
      ANALYSIS_SCHEDULE_TIMEZONE: ${ANALYSIS_SCHEDULE_TIMEZONE:-Asia/Kolkata}
      ANALYSIS_RUN_ON_STARTUP: ${ANALYSIS_RUN_ON_STARTUP:-true}
      FUNDAMENTALS_BATCH_SIZE: ${FUNDAMENTALS_BATCH_SIZE:-10}
      SCREENING_BATCH_SIZE: ${SCREENING_BATCH_SIZE:-10}
      UNIVERSE_SCHEDULE_MONTHS: ${UNIVERSE_SCHEDULE_MONTHS:-4,10}
      INVESTOR_DISCLOSURE_LAG_DAYS: ${INVESTOR_DISCLOSURE_LAG_DAYS:-21}
      DISCLOSURE_AUTO_INGEST_ENABLED: ${DISCLOSURE_AUTO_INGEST_ENABLED:-true}
      DISCLOSURE_BATCH_SIZE: ${DISCLOSURE_BATCH_SIZE:-10}
      DISCLOSURE_REQUEST_INTERVAL_SECONDS: ${DISCLOSURE_REQUEST_INTERVAL_SECONDS:-1.0}
      DISCLOSURE_CACHE_HOURS: ${DISCLOSURE_CACHE_HOURS:-24}
      DISCLOSURE_FUZZY_MATCH_THRESHOLD: ${DISCLOSURE_FUZZY_MATCH_THRESHOLD:-0.84}
      DISCLOSURE_LLM_PROVIDER: ${DISCLOSURE_LLM_PROVIDER:-auto}
      DISCLOSURE_LLM_MAX_CHARS: ${DISCLOSURE_LLM_MAX_CHARS:-120000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it:free}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      AUTOMATION_ALERTS_ENABLED: ${AUTOMATION_ALERTS_ENABLED:-true}
      IPO_DISCOVERY_ENABLED: ${IPO_DISCOVERY_ENABLED:-true}
      ANALYSIS_START_GRACE_MINUTES: ${ANALYSIS_START_GRACE_MINUTES:-15}
      ANALYSIS_STALL_MINUTES: ${ANALYSIS_STALL_MINUTES:-90}
      ANALYSIS_CATCHUP_MAX_HOURS: ${ANALYSIS_CATCHUP_MAX_HOURS:-48}
      ANALYSIS_RETRY_DELAYS_MINUTES: ${ANALYSIS_RETRY_DELAYS_MINUTES:-30,60}
      SCHEDULER_HEARTBEAT_SECONDS: ${SCHEDULER_HEARTBEAT_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.scheduler_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  ui:
    build:
      context: ./services/ui
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      # Used for links the user's own browser navigates to directly (not server-side calls),
      # so it must resolve from their machine, not just inside the Docker network.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      APP_TITLE: ${APP_TITLE:-Personal AI Portfolio Manager}
    depends_on:
      - api
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

volumes:
  portfolio_db:

id: quality_compounder
version: 1
name: Quality Compounder
description: Consistent growth, healthy margins, cash-backed earnings, and a conservative balance sheet.
applicability: non_financial
minimum_score: 75
minimum_coverage: 60
rules:
  - feature: revenue_growth_pct
    operator: gte
    value: 8
    weight: 20
    label: Revenue growth at least 8%
  - feature: net_profit_growth_pct
    operator: gte
    value: 8
    weight: 20
    label: Net profit growth at least 8%
  - feature: operating_margin_pct
    operator: gte
    value: 10
    weight: 15
    label: Operating margin at least 10%
  - feature: cash_conversion
    operator: gte
    value: 0.8
    weight: 25
    label: Operating cash flow covers at least 80% of net profit
  - feature: liabilities_to_assets
    operator: lte
    value: 0.6
    weight: 20
    label: Liabilities remain at or below 60% of assets

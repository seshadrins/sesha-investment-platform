id: capital_preservation
version: 1
name: Capital Preservation
description: Positive earnings and cash flow with stricter balance-sheet protection.
applicability: non_financial
minimum_score: 80
minimum_coverage: 75
rules:
  - feature: net_profit
    operator: gt
    value: 0
    weight: 25
    label: Net profit is positive
  - feature: operating_cash_flow
    operator: gt
    value: 0
    weight: 25
    label: Operating cash flow is positive
  - feature: cash_conversion
    operator: gte
    value: 0.8
    weight: 25
    label: Operating cash flow covers at least 80% of net profit
  - feature: liabilities_to_assets
    operator: lte
    value: 0.5
    weight: 25
    label: Liabilities remain at or below 50% of assets
